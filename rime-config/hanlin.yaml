# 寒淋输入法候选窗默认配置
config_version: "1.0"
global_ascii: true
style:
  ssf_skin: ""
  ssf_enabled: true
  ssf_status_bar: false
  font_face: Arial, 宋体
  label_font_face: Arial, 宋体
  comment_font_face: Arial, 宋体
  font_point: 16
  label_font_point: 16
  comment_font_point: 16
  horizontal: true
  inline_preedit: false
  label_format: "%s."
  layout:
    margin_x: 7
    margin_y: 5
    candidate_spacing: 14
    hilite_padding_x: 2
    hilite_padding_y: 2
